<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">From your laptop to a hosted demo</title><desc id="desc">Lab 2 • A successful local run is only the first deployment checkpoint.</desc><rect width="900" height="290" fill="#f4f8f5"/><text x="35" y="42" font-family="sans-serif" font-size="21" font-weight="700" fill="#173c42">From your laptop to a hosted demo</text><rect x="35" y="75" width="245" height="145" rx="12" fill="white" stroke="#9ebeb3"/><circle cx="60" cy="104" r="13" fill="#006d67"/><text x="60" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">1</text><text x="82" y="110" font-family="sans-serif" font-size="17" font-weight="700" fill="#173c42">Package</text><text x="52" y="145" font-family="sans-serif" font-size="15" fill="#37545b">app.py + backend.py</text><text x="52" y="170" font-family="sans-serif" font-size="15" fill="#37545b">requirements.txt</text><path d="M 287 150 h 28 m -9 -7 l 9 7 -9 7" fill="none" stroke="#006d67" stroke-width="3"/><rect x="325" y="75" width="245" height="145" rx="12" fill="white" stroke="#9ebeb3"/><circle cx="350" cy="104" r="13" fill="#006d67"/><text x="350" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">2</text><text x="372" y="110" font-family="sans-serif" font-size="17" font-weight="700" fill="#173c42">Configure</text><text x="342" y="145" font-family="sans-serif" font-size="15" fill="#37545b">Choose hosting runtime</text><text x="342" y="170" font-family="sans-serif" font-size="15" fill="#37545b">Set secrets on server</text><path d="M 577 150 h 28 m -9 -7 l 9 7 -9 7" fill="none" stroke="#006d67" stroke-width="3"/><rect x="615" y="75" width="245" height="145" rx="12" fill="white" stroke="#9ebeb3"/><circle cx="640" cy="104" r="13" fill="#006d67"/><text x="640" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">3</text><text x="662" y="110" font-family="sans-serif" font-size="17" font-weight="700" fill="#173c42">Verify</text><text x="632" y="145" font-family="sans-serif" font-size="15" fill="#37545b">Open in another browser</text><text x="632" y="170" font-family="sans-serif" font-size="15" fill="#37545b">Test errors and concurrency</text><text x="35" y="260" font-family="sans-serif" font-size="14" fill="#526570">Lab 2 • A successful local run is only the first deployment checkpoint.</text></svg>