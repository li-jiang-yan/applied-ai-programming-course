<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc"><title id="title">Trace an answer back to a source</title><desc id="desc">Lab 4 • Inspect retrieved chunks before judging generated prose.</desc><rect width="900" height="290" fill="#f4f8f5"/><text x="35" y="42" font-family="sans-serif" font-size="21" font-weight="700" fill="#173c42">Trace an answer back to a source</text><rect x="35" y="75" width="245" height="145" rx="12" fill="white" stroke="#9ebeb3"/><circle cx="60" cy="104" r="13" fill="#006d67"/><text x="60" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">1</text><text x="82" y="110" font-family="sans-serif" font-size="17" font-weight="700" fill="#173c42">Question</text><text x="52" y="145" font-family="sans-serif" font-size="15" fill="#37545b">When can I get a refund?</text><text x="52" y="170" font-family="sans-serif" font-size="15" fill="#37545b">Embed the query</text><path d="M 287 150 h 28 m -9 -7 l 9 7 -9 7" fill="none" stroke="#006d67" stroke-width="3"/><rect x="325" y="75" width="245" height="145" rx="12" fill="white" stroke="#9ebeb3"/><circle cx="350" cy="104" r="13" fill="#006d67"/><text x="350" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">2</text><text x="372" y="110" font-family="sans-serif" font-size="17" font-weight="700" fill="#173c42">Evidence</text><text x="342" y="145" font-family="sans-serif" font-size="15" fill="#37545b">refund.txt / chunk 1</text><text x="342" y="170" font-family="sans-serif" font-size="15" fill="#37545b">7 days before the start</text><path d="M 577 150 h 28 m -9 -7 l 9 7 -9 7" fill="none" stroke="#006d67" stroke-width="3"/><rect x="615" y="75" width="245" height="145" rx="12" fill="white" stroke="#9ebeb3"/><circle cx="640" cy="104" r="13" fill="#006d67"/><text x="640" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">3</text><text x="662" y="110" font-family="sans-serif" font-size="17" font-weight="700" fill="#173c42">Answer</text><text x="632" y="145" font-family="sans-serif" font-size="15" fill="#37545b">State the deadline</text><text x="632" y="170" font-family="sans-serif" font-size="15" fill="#37545b">Attach the source filename</text><text x="35" y="260" font-family="sans-serif" font-size="14" fill="#526570">Lab 4 • Inspect retrieved chunks before judging generated prose.</text></svg>