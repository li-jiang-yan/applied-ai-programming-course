sans-serif" font-size="17" font-weight="700" fill="#173c42">Inspect</text><text x="632" y="145" font-family="sans-serif" font-size="15" fill="#37545b">Read response text</text><text x="632" y="170" font-family="sans-serif" font-size="15" fill="#37545b">Check against evidence</text><text x="35" y="260" font-family="sans-serif" font-size="14" fill="#526570">Lab 1 • The prompt is input; the generated answer still needs checking.</text></svg>